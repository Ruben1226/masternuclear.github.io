# Regenera js/docs-manifest.js (el índice de documentos) cada vez que subes archivos.
# Así puedes arrastrar PDFs a las carpetas desde la web de GitHub y la página se actualiza sola.
name: Actualizar índice de documentos

on:
  push:
    branches: [main]
    paths-ignore:
      - "js/docs-manifest.js"
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write         # necesario para que el workflow guarde el índice actualizado

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar índice
        run: node tools/generar-manifiesto.mjs

      - name: Guardar cambios (solo si el índice cambió)
        run: |
          if [ -n "$(git status --porcelain js/docs-manifest.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/docs-manifest.js
            git commit -m "Actualizar índice de documentos"
            git push
          else
            echo "El índice ya estaba al día."
          fi
